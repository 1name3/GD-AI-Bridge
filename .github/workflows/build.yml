name: Build GD AI Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows .geode
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check LLVM version
        shell: bash
        run: |
          clang --version
          clang++ --version

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: Win64
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-AI-Bridge-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
