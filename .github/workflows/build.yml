name: Build GD AI Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows .geode
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang 19
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19
          clang-19 --version
          clang++-19 --version

      - name: Set Clang 19
        shell: bash
        run: |
          echo "CC=clang-19" >> $GITHUB_ENV
          echo "CXX=clang++-19" >> $GITHUB_ENV

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          cli: latest
          target: Win64
          build-config: Release

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-AI-Bridge-Windows
          path: ${{ steps.build.outputs.build-output }}/*.geode
